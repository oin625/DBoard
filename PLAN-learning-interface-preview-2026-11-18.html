e{background:#e2e9fa;color:#4566c5}.directory details{margin:15px 0 0}.directory summary{padding:10px 12px}.reader{padding:28px 32px;background:#fff}.reader h1{font-size:24px;margin:15px 0 22px;line-height:1.45}.reader .article{padding:0;border:0}.reader .article p{margin:16px 0}.reader .article h2{font-size:16px;margin:25px 0 12px}.reader .article h1{display:none}.note-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}.note-tile{text-align:left;border:1px solid var(--line);background:#fbfcfe;padding:18px;min-height:112px}.note-tile strong{display:block;font-size:14px;line-height:1.5;margin:9px 0 6px}.note-tile span{font-size:11px;color:var(--muted)}textarea{width:100%;border:0;background:#fafbfe;border-radius:12px;padding:18px;line-height:1.9;resize:vertical;min-height:300px;color:var(--ink)}input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:12px;min-width:0}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#26324b;color:#fff;border-radius:12px;padding:12px 20px;font-size:12px;box-shadow:0 6px 20px #0002;opacity:0;pointer-events:none;transition:opacity .2s}.toast.visible{opacity:1}dialog{border:1px solid var(--line);border-radius:18px;padding:27px;width:min(530px,90vw);box-shadow:0 20px 65px #0002}dialog::backdrop{background:#22304425;backdrop-filter:blur(5px)}dialog label{display:block;font-size:12px;margin:20px 0 8px}

<script>
const model={"id":"T007","title":"本地小模型研究","learningConfig":{"baseline":"现在基本是小白状态。","deadline":1795693032.073322,"goal":"明白模型界的基本知识，能知道什么类型模型什么时候用，多大的模型大概需要什么样的配置才能运行。能大概知道训练的方法和原理。大概就这些，由于目前是小白，所以我定的目标肯定不是最合适的。","minutesPerDay":60,"revision":1},"learningTopics":[{"id":"K001","title":"模型、应用与计算设备"},{"id":"K002","title":"参数量、量化与运行资源"},{"id":"K003","title":"训练、微调与LoRA"},{"id":"K004","title":"模型选型、指标与真实比较"}],"currentLearningStageID":"S006","currentLearningUnitID":"U-PREFILL-DECODE-SPEED","notes":[{"id":"N001","title":"","body":"要去huggingface，了解下模型的知识，以及本地小模型的知识。","origin":null,"topicIDs":null,"learningStageID":null,"displayTitle":"要去huggingface，了解下模型的知识，以及本地小模型的知识。"},{"id":"N002","title":"建立模型的基本概念","body":"","origin":null,"topicIDs":null,"learningStageID":"S001","displayTitle":"建立模型的基本概念"},{"id":"N003","title":"","body":"# **基础概念**\n**B** = 10亿 7B为10亿参数量\n**权重版本**：FP16（2字节）、8bit量化（1字节）、4bit量化（0.5字节）\n权重版本不同，所占用的空间不同，精度也会响应的不同。\n也就是说，从FP16，降低到4bit量化版本，空间降低的同时，回答质量也会降低，也就是说这并是有损压缩。\n**内存宽带**：每秒能读写多少数据，GB/s\n**模型推理引擎**：负责加载模型、管理内存、并按模型的计算流程，调用CPU/GPU等硬件执行运算。\n**模型推理软件**：LLaMA.cpp / MLX-LM\n**权重文件格式类型**：.gguf / .safetensors","origin":null,"topicIDs":null,"learningStageID":"S004","displayTitle":"基础概念"},{"id":"N004","title":"","body":"**训练**\n1、计算损失\n2、反向传播，计算梯度\n3、优化器更新参数\n**预训练**\n权重最初随机初始化，用大量文本等数据训练\n**微调**\n拿一个已经训练过的模型，继续用针对性数据训练\n- 全参数微调\n- 基础LORA做法\n> 新增一部分可训练参数，更新它们；原有权重冻结，但仍参与计算\n\n其他：\nAdam：负责更新权重的算法，会给每个需要训练的权重，额外记两个数\n1. 梯度的平均值\n2. 梯度平方的平均值\n\n量化：用更少的位数保存权重，减少占用，通常会损失一些精度。\nQLora ： 量化 +  LORA\n\n简单记忆：1B = 1G\n","origin":null,"topicIDs":null,"learningStageID":"S005","displayTitle":"训练"},{"id":"N005","title":"模型、应用与计算设备","body":"# 模型、应用与计算设备\n模型权重是计算用的参数，模型结构规定如何使用这些参数。推理引擎加载权重、管理运行数据，再调用支持的CPU/GPU完成计算。\n\n聊天应用把你的话、系统要求和历史组织成输入，也可以编排外部工具。应用、引擎和设备是不同层：CPU/GPU是硬件，不能直接代替运行软件。\n\n.gguf与.safetensors是保存格式；llama.cpp与MLX-LM是相关运行工具。MLX是Apple设备上的数组计算框架，MLX-LM基于它运行和微调语言模型。是否能使用某文件，要核对工具支持的模型结构与格式。\n\n这里结合N003整理，并补充已讲过的全局关系。N002正文为空，继续保留空原条目。","origin":"ai_organized","topicIDs":["K001"],"learningStageID":null,"displayTitle":"模型、应用与计算设备"},{"id":"N006","title":"参数量、量化与运行资源","body":"# 参数量、量化与运行资源\n1B是10亿个参数；7B约70亿个参数。N003原句“7B为10亿参数量”的数字在整理稿中修正为70亿。\n\n基础权重数值空间 ≈ 参数量 × 每参数位数 ÷ 8。\nFP16每个数值2字节、8bit约1字节、4bit约0.5字节。这只是粗算；附加信息、未量化部分和运行开销另计。\n7B全部按4bit保存，基础数值约3.5GB；实际文件与运行内存都可能更多。\n\n量化是用更少位数近似保存数值，会产生数值误差。它不是无损压缩；但具体任务分数不一定每项都下降。分别看文件大小、运行内存、速度与效果，不能只看4bit标签。\n\n内存带宽是每秒可读写的数据量，常用GB/s；N003的“内存宽带”在整理稿中修正。\n运行除权重外，还需要上下文相关的KV缓存、临时计算空间及系统空间。\n\nN004的“1B=1G”在原对话里是数量简写，都指10亿；不表示1B参数占1GB。容量还必须乘每参数字节数。\n\nPPL用于观察同模型同条件下的平均后续token预测表现，越低越好。它不是准确率，也不能把它的百分比变化当作质量损失百分比。具体数值、条件和来源见关联量化学习单元。","origin":"ai_organized","topicIDs":["K002"],"learningStageID":null,"displayTitle":"参数量、量化与运行资源"},{"id":"N007","title":"训练、微调与LoRA","body":"# 训练、微调与LoRA\n训练的常见步骤：由预测概率计算损失 → 反向传播算梯度 → 优化器更新可训练参数。\n计算损失不必先抽样出完整回答；模型给出的真实下一个token概率就可以参与损失计算。\n\n预训练通常从初始化权重开始，用大量数据训练。微调是在已有模型上继续训练。\n全参数微调更新原模型参数。基础LoRA增加少量可训练参数，原权重冻结但仍参与计算；保存的适配器需匹配基础模型。\n\nAdam给可训练参数保留两份统计：梯度的滑动平均、梯度平方的滑动平均。FP32一个数值用4字节；不能因此把整套训练内存只算成一份权重。\n训练还会占用梯度、优化器状态和反向计算所需的中间结果。\n\n量化处理保存数值的空间；LoRA选择训练哪些参数。QLoRA组合量化基础模型与LoRA微调。\n\n以上结合N004整理与补讲。用户S005实际回答仍缺独立理由和训练额外内存类别；整理稿写全不等于这部分已经掌握。","origin":"ai_organized","topicIDs":["K003"],"learningStageID":null,"displayTitle":"训练、微调与LoRA"},{"id":"N008","title":"模型选型、指标与真实比较","body":"# 模型选型、指标与真实比较\n这是已讲内容的AI整理补充，当前没有对应用户独立笔记。\n\nBase是基础模型；Instruct是在基础模型上继续做指令等训练后的版本，更适合按要求回答。文件格式、量化版本与运行工具分别核对。\n\nPhi-3-mini-4k-instruct这个版本的上下文上限是4096 token。输入、历史和生成回答共同使用窗口，4K不是参数量或文件大小。\n参考：[Phi配置文件](https://hf-mirror.com/microsoft/Phi-3-mini-4k-instruct/raw/main/config.json)。\n\n不同任务可出现模型强弱反转：Phi与Mistral在HumanEval、TriviaQA上的结果见关联单元。不能只按参数量排能力。\n同模型的量化比较更适合观察保存近似带来的变化，但仍需固定评测条件。PPL定义、量化文件大小与因果边界见关联单元。\n\n选型要说明任务、语言、上下文、模型版本、格式与工具支持、资源条件和任务结果。\n照片识别内容通常是图像→文字；录音转写是音频→文字；生成图片或语音是其他任务。先确定需要得到什么结果，再选工具或模型。\n\n用户S003真实作答中选择甲、照片→文字正确，并提出核对引擎；三项卡片依据未提供，录音→文字尚未核清。保留这些缺项，今后主动复习/复测或阶段末再验证。","origin":"ai_supplement","topicIDs":["K004"],"learningStageID":null,"displayTitle":"模型选型、指标与真实比较"}],"stages":[{"id":"S001","title":"建立模型的基本概念"},{"id":"S006","title":"综合选型与复习自测"},{"id":"S003","title":"用Hugging Face模型卡片做选型"},{"id":"S005","title":"理解训练与微调的基本原理"},{"id":"S004","title":"粗估本机与芯片的运行条件"},{"id":"S002","title":"比较文字、图像与语音模型"}]};

const snippets={
N005:[['模型到应用','模型由结构和权重组成。推理引擎加载权重、管理运行数据，调用 CPU／GPU 完成计算；聊天应用组织输入、调用模型和工具，再展示结果。'],['文件与工具','GGUF、safetensors 是权重保存格式。llama.cpp、MLX-LM 是运行工具；MLX 是 Apple 设备上的数组计算框架，MLX-LM 基于它运行和微调语言模型。使用前要核对工具支持的结构与格式。']],
N006:[['参数量与权重空间','1B 是 10 亿个参数，7B 约 70 亿。\n基础权重空间 ≈ 参数量 × 每参数位数 ÷ 8。\nFP16 每个数值 2 字节，8bit 约 1 字节，4bit 约 0.5 字节。7B 全部按 4bit 保存时，基础数值约 3.5GB；实际文件还有附加数据。'],['量化与运行资源','量化用更少位数近似保存数值，会产生误差，具体任务表现仍需比较。文件大小、运行内存、速度和效果要分别看。\n运行除权重外还需要 KV 缓存、临时计算空间，以及系统和其他应用的空间。内存带宽描述每秒可读写的数据量，常用 GB/s。'],['怎样读 PPL','PPL 描述同模型、同条件下的平均后续 token 预测表现，越低越好。它不是答题正确率，也不能把其百分比变化直接当作质量损失。']],
N007:[['训练的动作','计算损失 → 反向传播算梯度 → 优化器更新可训练参数。计算损失不需要先抽样生成完整回答。'],['预训练、微调与 LoRA','预训练通常从初始化权重开始，用大量数据学习。微调在已有模型上继续训练。\n全参数微调更新原模型参数；基础 LoRA 增加少量可训练参数，原权重冻结但仍参与计算。适配器需要匹配基础模型。'],['训练为什么更占内存','Adam 保留梯度及梯度平方的滑动平均。训练还需要梯度、优化器状态与反向计算的中间结果。\n量化处理数值保存方式，LoRA 选择训练哪些参数；QLoRA 组合量化基础模型与 LoRA 微调。']],
N008:[['先确定任务','先看输入和期望输出：照片识别通常是图像→文字，录音转写是音频→文字，生成图片或语音属于其他任务。'],['核对具体版本','Base 是基础模型；Instruct 是继续接受指令等训练的版本。模型版本、量化、文件格式和运行工具分别核对。\nPhi-3-mini-4k-instruct 的 4K 指 4096 token 上下文，输入、历史与生成回答共同占用窗口。'],['比较效果与资源','模型在不同任务上可能各有强项，不能只按参数量排序。同模型的量化比较要固定评测条件。\n选型要说明任务、语言、上下文、版本、工具支持、资源条件和实际任务结果。']]

function render(){document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===currentScreen));page.className='page '+(currentScreen==='notes'?'notebook':'');page.innerHTML=currentScreen==='home'?home():currentScreen==='study'?study():notebook()}
function home(){return `<div class="row between"><h1>学习</h1><button class="secondary" onclick="document.getElementById('start').showModal()">＋ 开启学习</button></div>
<section class="card home-hero"><div class="row between"><span class="mono">T007</span><span class="badge blue">进行中</span></div><h2>本地小模型研究</h2><div class="goal">认识模型类型，能做基本选型和运行资源估算，理解训练原理。</div><div class="current"><span class="tiny muted">正在学习 · 综合选型与复习自测</span><strong>同一个模型，处理输入和生成回答为什么速度不同？</strong><div class="tiny muted">接着上次的输入处理、逐步生成与 KV 缓存继续。</div></div><div class="progress"><div class="steps"><span class="done"></span><span></span><span></span><span></span><span></span><span></span></div><span class="tiny muted">1 / 6 阶段已核验</span></div><div class="row between" style="flex-wrap:wrap"><div class="actions"><button class="primary" onclick="navigate('study')">继续学习</button><button onclick="navigate('notes')">笔记本</button></div><span class="tiny muted">11月26日截止 · 每天60分钟</span></div></section>
<div class="row between" style="margin-top:21px"><button class="quiet" onclick="navigate('notes')">已留下 8 篇记录 →</button><span class="tiny muted">4 篇知识整理 · 4 篇原始记录</span></div>`}
function study(){return `<div class="study-head"><div class="row between"><div class="row"><span class="mono muted">T007</span><h1>本地小模型研究</h1></div><button onclick="navigate('notes')">笔记本</button></div><div class="goal">认识模型类型，做基本选型与资源估算，理解训练原理。</div><div class="row tiny muted"><span>11月26日截止</span><span>每天60分钟</span><span>1 / 6 阶段已核验</span></div></div>
<div class="study-top"><details><summary>学习路线 · 当前：综合选型与复习自测</summary><div class="stages">${model.stages.map(s=>`<span class="badge ${s.id===model.currentLearningStageID?'blue':''}">${escapeHTML(s.title)}${s.id==='S001'?' · 已核验':''}</span>`).join('')}</div></details></div>
<section class="article"><span class="badge">公开文档示例</span><h2 style="font-size:22px;margin-top:15px">处理输入和生成回答，为什么速度差这么多？</h2><p>同一个 Qwen2.5-7B-Instruct 的 Q4_K_M 版本，官方 llama-bench 文档示例给出了两种动作的测速：</p><div class="numbers"><div class="metric"><span class="tiny muted">处理已有输入 · pp512</span><div style="margin-top:10px"><strong>≈7,100</strong> <span class="tiny">token/s</span></div><p>一次处理已给出的 512 token</p></div><div class="metric"><span class="tiny muted">逐步生成内容 · tg128</span><div style="margin-top:10px"><strong>≈119</strong> <span class="tiny">token/s</span></div><p>逐步生成 128 token</p></div></div>
<h3>区别在于：输入已经给出，回答还没有产生</h3><p>处理输入时，引擎可以把许多位置的计算组织成批量运算，并建立 KV 缓存。逐步生成时，下一步依赖前一步刚选出的 token，不能把整段未知回答当作已知输入处理。</p><p>KV 缓存复用历史内容的部分计算结果，减少重复计算；它不会保存尚未生成的回答，也不会消除生成步骤之间的依赖。</p><h3>怎样用这两个指标做判断</h3><ul><li>长材料生成短摘要：关注输入处理与首个 token 的等待。</li><li>短要求生成长回答：关注持续生成速度。</li><li>内存是否足够、答案是否可靠，仍需分别核对。</li></ul>
<details><summary>测试条件、限制与来源</summary><p>此处是 RTX 4080 / CUDA 的公开文档示例，并非当前 Mac 实测。pp 与 tg 是独立测试，不能直接拼成同一次请求的时长。首 token 的等待还可能包含排队、加载、分词和传输。</p><p><a href="https://raw.githubusercontent.com/ggml-org/llama.cpp/master/tools/llama-bench/README.md" target="_blank" rel="noreferrer">llama-bench 官方文档 · JSON 示例</a></p></details>
<div class="article-footer"><div class="actions"><button class="primary" onclick="tell('正式版将复制本阶段学习指令，带上当前疑问和相关笔记')">交给 AI 继续</button><button class="secondary" onclick="selectedNote='new';reading=false;currentScreen='notes';render()">记下理解或疑问</button></div><button class="quiet" onclick="tell('正式版在主动自测或阶段结束时记录真实回答与核验结果')">阶段自测</button></div></section>`}
function notebook(){return `<div class="notebook-head row between"><div class="row"><span class="mono muted">T007</span><strong>本地小模型研究 · 笔记本</strong></div><button class="secondary" onclick="selectedNote='new';reading=false;render()">＋ 新一篇</button></div><div class="book-layout"><aside class="directory"><button class="${selectedNote===null?'active':''}" onclick="selectNote(null)">全部笔记 <span class="muted">· 8</span></button><div class="label">知识笔记</div>${model.notes.filter(n=>n.origin).map(noteButton).join('')}<details ${originalsOpen?'open':''} ontoggle="originalsOpen=this.open"><summary>原始记录 · 4</summary>${model.notes.filter(n=>!n.origin).map(noteButton).join('')}</details></aside><section class="reader">${selectedNote===null?noteOverview():selectedNote==='new'?writer():noteContent()}</section></div>`}
function noteButton(n){return `<button class="${selectedNote===n.id?'active':''}" onclick="selectNote('${n.id}')"><span class="mono muted" style="display:block;font-size:10px">${n.id}</span>${escapeHTML(n.displayTitle)}</button>`}
function selectNote(id){selectedNote=id;reading=true;render()}
function noteOverview(){return `<span class="tiny muted">全部笔记</span><h1>留下来的知识</h1><div class="tiny muted">4 篇知识整理，原始记录可独立回看。</div><div class="note-grid">${model.notes.filter(n=>n.origin).map(n=>`<button class="note-tile" onclick="selectNote('${n.id}')"><span>${n.id} · ${n.origin==='ai_supplement'?'AI补充':'AI整理'}</span><strong>${escapeHTML(n.displayTitle)}</strong><span>${escapeHTML(snippets[n.id]?.[0][0]||'')}</span></button>`).join('')}</div><details><summary>原始记录 · 4</summary><div class="stack">${model.notes.filter(n=>!n.origin).map(n=>`<button class="note-tile" style="min-height:70px" onclick="selectNote('${n.id}')"><span>${n.id} · ${n.body?'原文':'空白记录'}</span><strong>${escapeHTML(n.displayTitle)}</strong></button>`).join('')}</div></details>`}
function noteBody(n){const lines=n.body.split('\n');const first=(lines[0]||'').replace(/^#+\s*/, '').replace(/\*\*/g,'').trim();return first===n.displayTitle&&/^(#|\*\*)/.test(lines[0])?lines.slice(1).join('\n').trim():n.body}
function noteContent(){const n=model.notes.find(n=>n.id===selectedNote);if(!n)return '';if(!reading)return writer(n);
return `<div class="row between"><span class="tiny muted">${n.id} · ${n.origin?(n.origin==='ai_supplement'?'AI补充 · 已采纳':'AI整理 · 已采纳'):'原始记录'}</span><button onclick="reading=false;render()">编辑</button></div><h1>${escapeHTML(n.displayTitle)}</h1><article class="article">${snippets[n.id]?snippets[n.id].map(([title,body])=>`<h2>${escapeHTML(title)}</h2><p>${escapeHTML(body).replace(/\n/g,'<br>')}</p>`).join(''):`<p style="white-space:pre-wrap">${escapeHTML(noteBody(n)||'正文为空。')}</p>`}</article>${n.origin?`<details><summary>来源、原文与整理说明</summary><p class="tiny muted">整理页保留来源关系，掌握情况在学习复习页单独呈现。</p><div class="actions">${(n.id==='N005'?['N003']:n.id==='N006'?['N003','N004']:n.id==='N007'?['N004']:[]).map(id=>`<button class="secondary" onclick="originalsOpen=true;selectNote('${id}')">查看原文 ${id}</button>`).join('')}</div></details>`:''}`}
function writer(n=null){return `<div class="row between"><span class="tiny muted">${n?n.id+' · 编辑':'新笔记 · 关联当前学习阶段'}</span><button onclick="reading=true;if(selectedNote==='new')selectedNote=null;render()">${n?'回到阅读':'关闭'}</button></div><h1>${n?escapeHTML(n.displayTitle):'记下自己的理解'}</h1><textarea aria-label="笔记正文" placeholder="理解了什么，还有什么不明白……">${n?escapeHTML(n.body.replace(/^# [^\n]+\n/,'')):''}</textarea><div class="row between" style="margin-top:16px"><span class="tiny muted">预览书写区域 · 不保存内容</span><button class="secondary" onclick="tell('正式版保留图片、加粗、列表、引用与后台自动保存')">格式与图片</button></div>`}
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>navigate(b.dataset.screen));render();
</script>
</html>
